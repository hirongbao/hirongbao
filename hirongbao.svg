<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    
    <!-- 卡片渐变 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
    
    <!-- 柔和阴影 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-opacity="0.08" flood-color="#000000"/>
    </filter>

    <!-- 裁剪路径 (用于图片占位) -->
    <clipPath id="mediaClip">
      <rect x="40" y="100" width="320" height="160" rx="16" />
    </clipPath>
  </defs>

  <!-- 底层背景 -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- 氛围光晕 (Emerald 翠绿 & Zinc 灰) -->
  <circle cx="650" cy="150" r="120" fill="#34d399" opacity="0.15" filter="blur(50px)"/>
  <circle cx="150" cy="450" r="180" fill="#a1a1aa" opacity="0.15" filter="blur(60px)"/>

  <!-- 主动态卡片 -->
  <g transform="translate(200, 100)" filter="url(#softShadow)">
    <rect width="400" height="380" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2"/>
    
    <!-- 发帖人头像 & 信息 -->
    <circle cx="44" cy="52" r="20" fill="#e4e4e7"/>
    <rect x="76" y="40" width="100" height="8" rx="4" fill="#d4d4d8"/>
    <rect x="76" y="56" width="60" height="6" rx="3" fill="#e4e4e7"/>
    
    <!-- 分类标签 (呼应我们刚做的分类功能) -->
    <rect x="300" y="38" width="64" height="28" rx="14" fill="#ecfdf5"/>
    <circle cx="316" cy="52" r="4" fill="#10b981"/>
    <rect x="328" y="49" width="22" height="6" rx="3" fill="#34d399"/>

    <!-- 媒体内容占位图 -->
    <rect x="40" y="100" width="320" height="160" rx="16" fill="#f4f4f5"/>
    <g clip-path="url(#mediaClip)">
      <circle cx="120" cy="150" r="28" fill="#10b981" opacity="0.1"/>
      <path d="M20 280 L140 150 L230 220 L290 160 L400 280 Z" fill="#e4e4e7" opacity="0.6"/>
    </g>
    
    <!-- 正文占位 -->
    <rect x="40" y="290" width="300" height="10" rx="5" fill="#d4d4d8"/>
    <rect x="40" y="314" width="240" height="10" rx="5" fill="#e4e4e7"/>
    <rect x="40" y="338" width="180" height="10" rx="5" fill="#e4e4e7"/>
  </g>

  <!-- 第二张卡片 (露出一半，体现瀑布流/信息流的概念) -->
  <g transform="translate(230, 510)" filter="url(#softShadow)" opacity="0.8">
    <rect width="340" height="200" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="44" cy="52" r="20" fill="#e4e4e7"/>
    <rect x="76" y="40" width="120" height="8" rx="4" fill="#d4d4d8"/>
    <rect x="76" y="56" width="80" height="6" rx="3" fill="#e4e4e7"/>
  </g>
</svg>